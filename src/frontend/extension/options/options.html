<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vocabulary OS - Settings</title>
  <link rel="stylesheet" href="options.css">
  <!-- Same Inter font as the dashboard -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h2>⚙️ Vocabulary OS Settings</h2>
      <p>Configure your API integrations below to enable context-aware capture.</p>
    </header>

    <div class="card">
      <h3>Backend Configuration</h3>
      <div class="form-group">
        <label for="backendUrl">Local Python Backend URL</label>
        <input type="url" id="backendUrl" value="http://127.0.0.1:8000" placeholder="http://127.0.0.1:8000">
        <p class="help-text">Ensure your Python FastAPI server is running before capture.</p>
      </div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn btn-primary">Save Settings</button>
      <span id="statusMessage" class="status-msg"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
