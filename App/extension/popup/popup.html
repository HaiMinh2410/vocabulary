<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="tailwind.css">
  <style>
    body { width: 300px; }
  </style>
</head>
<body class="bg-slate-50 font-sans p-0 m-0">
  <div class="p-5">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-gradient-to-br from-blue-400 to-indigo-600 text-white shadow-lg shadow-blue-500/30">
        <i data-lucide="brain-circuit" class="w-6 h-6"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-bold text-slate-800 leading-none">Vocab OS</span>
        <span class="text-[10px] font-bold text-blue-500 uppercase tracking-widest mt-1">Learning OS</span>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm mb-5 text-center">
      <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3">
        <i data-lucide="info" class="w-5 h-5 text-slate-400"></i>
      </div>
      <p class="text-sm text-slate-600 leading-relaxed font-medium">Bôi đen bất kỳ từ nào trên trang web để lưu và phân tích ngữ cảnh!</p>
    </div>

    <div class="space-y-3">
      <button id="openDashboard" class="flex items-center justify-center gap-2 w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-600/20 transition-all hover:scale-[1.02] active:scale-95">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Mở Dashboard
      </button>
      <button id="openOptions" class="flex items-center justify-center gap-2 w-full py-3 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 rounded-xl font-bold shadow-sm transition-all active:scale-95">
        <i data-lucide="settings" class="w-4 h-4"></i> Cài đặt
      </button>
    </div>
  </div>

  <div class="bg-indigo-600/5 p-3 text-center border-t border-slate-100">
    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Phiên bản 1.0.0</span>
  </div>

  <script src="../lucide.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
