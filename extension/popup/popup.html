<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 250px;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }
    .logo { color: #5B9CFF; font-weight: bold; font-size: 18px; margin-bottom: 12px; }
    .btn {
      background: #5B9CFF;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    p { font-size: 14px; color: #666; }
  </style>
</head>
<body>
  <div class="logo">Vocabulary OS</div>
  <p>Highlight any word on a webpage and click "Capture" to save it!</p>
  <button id="openDashboard" class="btn">Open Dashboard</button>
  <button id="openOptions" class="btn" style="margin-top: 8px; background: #f0f0f0; color: #333;">Settings</button>
  
  <script src="popup.js"></script>
</body>
</html>
